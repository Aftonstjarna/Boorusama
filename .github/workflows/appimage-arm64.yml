name: appimage-arm64

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create a GitHub release with the AppImage'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    env:
      BOORUSAMA_USE_FVM: 'false'
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build meson nasm pkg-config \
            libgtk-3-dev liblzma-dev libmpv-dev \
            build-essential podman squashfs-tools binutils curl

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: main
          cache: true

      - name: Initialize workspace
        run: |
          flutter --version
          ./init.sh

      - name: Build Linux bundle
        run: flutter build linux --release

      - name: Resolve version
        id: version
        run: |
          echo "version=$(sed -n 's/^version: *//p' pubspec.yaml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Collect aarch64 libmpv closure
        run: MODE=full ./tool/appimage/collect-libs.sh

      - name: Build AppImage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./tool/appimage/build-appimage.sh

      - name: Write checksum
        run: |
          cd dist
          app=$(ls -1 *.AppImage | head -1)
          sha256sum "$app" > "$app.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: Boorusama-${{ steps.version.outputs.version }}-anylinux-aarch64
          path: |
            dist/*.AppImage
            dist/*.sha256
          if-no-files-found: error

      - name: Publish release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="appimage-v$VERSION"
          gh release create "$tag" dist/*.AppImage dist/*.sha256 \
            -R "$GITHUB_REPOSITORY" \
            --title "Boorusama $VERSION — ARM64 AppImage" \
            --notes "aarch64 AppImage built from source on an ARM64 runner.

          Skia is forced on arm64 (Impeller's GLES path over Mesa zink corrupts
          textures). Bundles the full libmpv closure used by media_kit; the host
          provides glibc, GTK3, X11/Wayland, Vulkan and audio clients."
